name: NBA daily results and injury refresh
on:
  schedule:
    - cron: '20 12 * * *'
    - cron: '20 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_projections.py'
      - 'scripts/daily_update.py'
      - 'data/power_ratings.csv'
      - '.github/workflows/daily-nba.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh completed games and ratings
        id: results
        continue-on-error: true
        run: python scripts/daily_update.py
      - name: Build matchup projections
        id: projections
        continue-on-error: true
        run: python scripts/build_projections.py
      - name: Refresh injuries (do not erase last snapshot on failure)
        continue-on-error: true
        run: python scripts/injury_check.py
      - name: Commit data changes
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "nba-edge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Automated NBA data refresh"
            git push
          fi

      - name: Report pipeline component failures
        if: always()
        run: |
          echo "Results: ${{ steps.results.outcome }}"
          echo "Projections: ${{ steps.projections.outcome }}"
          if [[ "${{ steps.results.outcome }}" != "success" || "${{ steps.projections.outcome }}" != "success" ]]; then
            exit 1
          fi
